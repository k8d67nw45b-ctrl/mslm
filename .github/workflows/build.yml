name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      abi:
        description: 'android-arm64 or android-arm'
        default: 'android-arm64'
      target_mb:
        description: 'Quran pages target size in MB'
        default: '20'

permissions:
  contents: write

env:
  APP_ID: com.rafiqalmuslim.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download adhan audio
        run: |
          mkdir -p adhan_audio
          B=https://archive.org/download/MasjidAn-nabawiRecordings
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -A "Mozilla/5.0" -o /tmp/raw_adhan_madinah.ogg "$B/AdhanMasjidNabawi.ogg"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -A "Mozilla/5.0" -o /tmp/raw_adhan_fajr.ogg "$B/14AugFajrAdhanMadinah.ogg"
          ls -l /tmp/raw_adhan_*.ogg
          file /tmp/raw_adhan_*.ogg
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          for n in adhan_madinah adhan_fajr; do
            ffmpeg -y -loglevel error -i /tmp/raw_$n.ogg -vn -ac 1 -ar 32000 -c:a libvorbis -q:a 2 adhan_audio/$n.ogg || cp /tmp/raw_$n.ogg adhan_audio/$n.ogg
            echo "duration of $n (seconds):"
            ffprobe -v error -show_entries format=duration -of csv=p=0 adhan_audio/$n.ogg || true
          done
          ls -l adhan_audio

      - name: Restore Quran assets
        id: qcache
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/mushaf
            assets/data
          key: quran-assets-v6-${{ github.event.inputs.target_mb || '20' }}

      - name: Download Quran assets
        if: steps.qcache.outputs.cache-hit != 'true'
        env:
          TARGET_MB: ${{ github.event.inputs.target_mb || '20' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick
          mkdir -p assets/mushaf assets/data /tmp/orig
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o assets/data/quran_uthmani.json https://api.alquran.cloud/v1/quran/quran-uthmani
          python3 -c "import json; d=json.load(open('assets/data/quran_uthmani.json')); assert len(d['data']['surahs'])==114"
          cat > /tmp/dl.sh <<'SH'
          #!/bin/sh
          p="$1"
          if [ -s "/tmp/orig/p$p.png" ]; then
            exit 0
          fi
          ok=0
          for i in 1 2 3 4 5 6; do
            for base in "https://cdn.jsdelivr.net/gh/SakinaDevGroup/mushaf-madani-cdn@main" "https://raw.githubusercontent.com/SakinaDevGroup/mushaf-madani-cdn/main"; do
              if curl -fsSL --max-time 90 -o "/tmp/orig/p$p.png" "$base/light/p$p.png"; then
                ok=1
                break
              fi
            done
            if [ "$ok" = 1 ]; then
              break
            fi
            sleep $((i * 2))
          done
          if [ "$ok" != 1 ]; then
            echo "FAILED page $p"
            rm -f "/tmp/orig/p$p.png"
            exit 1
          fi
          SH
          chmod +x /tmp/dl.sh
          seq 1 604 | xargs -P 4 -n 1 /tmp/dl.sh || true
          for p in $(seq 1 604); do /tmp/dl.sh $p; done
          test "$(ls /tmp/orig | wc -l)" -eq 604
          du -sh /tmp/orig
          file /tmp/orig/p1.png /tmp/orig/p300.png
          cat > /tmp/cal.sh <<'SH'
          #!/bin/bash
          SAMPLES="30 80 130 180 230 280 330 380 430 480 530 580"
          N=12
          CHOSEN=""
          for CFG in 100:85 100:75 100:65 90:80 90:70 80:80 80:70 75:75 75:65 70:70 70:60 65:60 60:60 60:50 55:55; do
            S=${CFG%%:*}
            Q=${CFG##*:}
            TOTAL=0
            for p in $SAMPLES; do
              convert "/tmp/orig/p$p.png" -strip -resize "${S}%" /tmp/cal.png
              cwebp -quiet -q "$Q" -m 6 /tmp/cal.png -o /tmp/cal.webp
              TOTAL=$((TOTAL + $(stat -c%s /tmp/cal.webp)))
            done
            AVG=$((TOTAL / N))
            EST=$((AVG * 604 / 1048576))
            echo "CAL scale=${S}% q=${Q} avg=$((AVG / 1024))KB est=${EST}MB target=${TARGET_MB}MB"
            CHOSEN=$CFG
            if [ "$EST" -le "$TARGET_MB" ]; then
              break
            fi
          done
          echo "$CHOSEN" > /tmp/chosen.txt
          SH
          bash /tmp/cal.sh
          CFG=$(cat /tmp/chosen.txt)
          export SCALE=${CFG%%:*}
          export QUAL=${CFG##*:}
          echo "FINAL scale=${SCALE}% q=${QUAL}"
          cat > /tmp/cv.sh <<'SH'
          #!/bin/sh
          p="$1"
          convert "/tmp/orig/p$p.png" -strip -resize "${SCALE}%" "/tmp/q$p.png" || exit 1
          cwebp -quiet -q "$QUAL" -m 6 "/tmp/q$p.png" -o "assets/mushaf/p$p.webp" || exit 1
          rm -f "/tmp/q$p.png"
          SH
          chmod +x /tmp/cv.sh
          rm -f assets/mushaf/*.webp
          seq 1 604 | xargs -P 4 -n 1 /tmp/cv.sh
          test "$(ls assets/mushaf | wc -l)" -eq 604
          echo "RESULT final scale=${SCALE}% q=${QUAL} size=$(du -sm assets/mushaf | cut -f1)MB target=${TARGET_MB}MB"
          du -sh assets/mushaf

      - name: Save Quran assets
        if: steps.qcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            assets/mushaf
            assets/data
          key: quran-assets-v6-${{ github.event.inputs.target_mb || '20' }}

      - name: Size report of assets
        run: |
          du -sh assets/mushaf assets/data adhan_audio || true

      - name: Download adhkar data
        run: |
          mkdir -p assets/data
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o assets/data/adhkar_ar.json https://raw.githubusercontent.com/Seen-Arabic/Morning-And-Evening-Adhkar-DB/main/ar.json
          python3 -c "import json; d=json.load(open('assets/data/adhkar_ar.json', encoding='utf-8')); print(type(d).__name__, len(d))"

      - name: Download hisn and nawawi
        run: |
          mkdir -p assets/data
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o assets/data/hisn_almuslim.json https://raw.githubusercontent.com/rn0x/hisn_almuslim_json/main/hisn_almuslim.json
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o assets/data/nawawi.json https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-nawawi.json
          python3 -c "import json; d=json.load(open('assets/data/hisn_almuslim.json', encoding='utf-8')); print('hisn', len(d))"
          python3 -c "import json; d=json.load(open('assets/data/nawawi.json', encoding='utf-8')); print('nawawi', len(d['hadiths']))"

      - name: Download six hadith books
        run: |
          mkdir -p assets/data
          for b in bukhari muslim abudawud tirmidhi nasai ibnmajah; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/raw_$b.json https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-$b.json
          done
          python3 - <<'PY'
          import json
          books = ['bukhari', 'muslim', 'abudawud', 'tirmidhi', 'nasai', 'ibnmajah']
          for b in books:
              d = json.load(open('/tmp/raw_%s.json' % b, encoding='utf-8'))
              out = []
              for h in d['hadiths']:
                  text = (h.get('text') or '').strip()
                  if not text:
                      continue
                  gr = ''
                  by = ''
                  g = h.get('grades') or []
                  if g and isinstance(g[0], dict):
                      gr = str(g[0].get('grade', ''))
                      by = str(g[0].get('name', ''))
                  out.append([h.get('hadithnumber'), text, gr, by])
              assert len(out) > 1000, b
              with open('assets/data/hadith_%s.json' % b, 'w', encoding='utf-8') as f:
                  json.dump(out, f, ensure_ascii=False, separators=(',', ':'))
              print(b, len(out), 'hadiths')
          PY
          ls -l assets/data/hadith_*.json
          du -ch assets/data/hadith_*.json | tail -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate android folder
        run: flutter create --platforms=android --project-name muslm --org com.muslm .

      - name: Patch gradle
        run: |
          python3 - <<'PY'
          import os, re
          app_id = os.environ.get('APP_ID', '')
          for fn in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              if not os.path.exists(fn):
                  continue
              s = open(fn, encoding='utf-8').read()
              kts = fn.endswith('.kts')
              flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
              if 'oreLibraryDesugaringEnabled' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        ' + flag, 1)
              if kts:
                  dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              else:
                  dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              if 'desugar_jdk_libs' not in s:
                  s += '\ndependencies {\n    ' + dep + '\n}\n'
              if app_id:
                  s = re.sub(r'applicationId\s*=?\s*"[^"]*"', 'applicationId = "%s"' % app_id, s, count=1)
              open(fn, 'w', encoding='utf-8').write(s)
              print('patched', fn)
          PY
          grep -n "applicationId" android/app/build.gradle* || true
          cat android/app/build.gradle* | head -80

      - name: Disable shrinking for notifications
        run: |
          python3 - <<'PY'
          import os
          for fn in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              if not os.path.exists(fn):
                  continue
              s = open(fn, encoding='utf-8').read()
              kts = fn.endswith('.kts')
              i = s.find('buildTypes')
              j = s.find('release {', i) if i >= 0 else -1
              if j >= 0 and 'inifyEnabled' not in s:
                  if kts:
                      ins = 'release {\n            isMinifyEnabled = false\n            isShrinkResources = false'
                  else:
                      ins = 'release {\n            minifyEnabled false\n            shrinkResources false'
                  s = s[:j] + ins + s[j + len('release {'):]
                  open(fn, 'w', encoding='utf-8').write(s)
                  print('patched', fn)
          PY
          mkdir -p android/app/src/main/res/raw
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@drawable/ic_stat,@mipmap/ic_launcher,@raw/adhan_madinah,@raw/adhan_fajr" />' > android/app/src/main/res/raw/keep.xml

      - name: Configure release signing
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re
          pw = os.environ.get('KS_PASS', '')
          ks = os.path.abspath('signing/release.jks')
          if not pw or not os.path.exists(ks):
              print('No release keystore or password found: the APK will use the debug key')
              raise SystemExit(0)
          for fn in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              if not os.path.exists(fn):
                  continue
              s = open(fn, encoding='utf-8').read()
              kts = fn.endswith('.kts')
              if 'KS_FILE' in s:
                  continue
              if kts:
                  block = ('signingConfigs {\n'
                           '        create("release") {\n'
                           '            storeFile = file(System.getenv("KS_FILE"))\n'
                           '            storePassword = System.getenv("KS_PASS")\n'
                           '            keyAlias = "rafiq"\n'
                           '            keyPassword = System.getenv("KS_PASS")\n'
                           '        }\n'
                           '    }\n\n    ')
                  use = 'signingConfig = signingConfigs.getByName("release")'
              else:
                  block = ('signingConfigs {\n'
                           '        release {\n'
                           '            storeFile file(System.getenv("KS_FILE"))\n'
                           '            storePassword System.getenv("KS_PASS")\n'
                           '            keyAlias "rafiq"\n'
                           '            keyPassword System.getenv("KS_PASS")\n'
                           '        }\n'
                           '    }\n\n    ')
                  use = 'signingConfig signingConfigs.release'
              i = s.find('buildTypes')
              if i < 0:
                  print('buildTypes not found in', fn)
                  continue
              s = s[:i] + block + s[i:]
              pat = re.compile(r'signingConfig\s*=?\s*signingConfigs[^\n]*')
              if pat.search(s):
                  s = pat.sub(use, s, count=1)
              else:
                  b = s.find('buildTypes')
                  j = s.find('release {', b)
                  if j >= 0:
                      s = s[:j] + 'release {\n            ' + use + s[j + len('release {'):]
              open(fn, 'w', encoding='utf-8').write(s)
              print('signing configured in', fn)
          PY

      - name: Add adhan sounds
        run: |
          mkdir -p android/app/src/main/res/raw
          cp adhan_audio/adhan_madinah.ogg android/app/src/main/res/raw/adhan_madinah.ogg
          cp adhan_audio/adhan_fajr.ogg android/app/src/main/res/raw/adhan_fajr.ogg
          ls -l android/app/src/main/res/raw

      - name: Generate app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-hosny-amiri || true
          python3 -m venv /tmp/iv
          /tmp/iv/bin/pip install pillow arabic-reshaper
          /tmp/iv/bin/python - <<'PY'
          import math, os, subprocess
          from PIL import Image, ImageDraw, ImageFont
          import arabic_reshaper

          def ar(t):
              return arabic_reshaper.reshape(t)[::-1]

          def find_font():
              out = subprocess.run(['fc-list', ':lang=ar', 'file'], capture_output=True, text=True).stdout
              files = [l.split(':')[0].strip() for l in out.splitlines() if l.strip()]
              files = [f for f in files if f.lower().endswith(('.ttf', '.otf'))]
              for key in ('Amiri-Bold', 'Amiri', 'Naskh', 'DejaVuSans-Bold', 'DejaVuSans'):
                  for f in files:
                      if key in f:
                          return f
              if files:
                  return files[0]
              return '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'

          S = 1024
          GOLD = (255, 215, 106, 255)
          WHITE = (255, 255, 255, 255)
          img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          grad = Image.new('RGB', (S, S))
          gd = ImageDraw.Draw(grad)
          top = (0, 92, 66)
          bot = (8, 44, 34)
          for y in range(S):
              t = y / (S - 1)
              c = tuple(int(top[i] + (bot[i] - top[i]) * t) for i in range(3))
              gd.line([(0, y), (S, y)], fill=c)
          mask = Image.new('L', (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, S - 1, S - 1], radius=int(S * 0.22), fill=255)
          img.paste(grad, (0, 0), mask)

          cx = S // 2 - int(S * 0.03)
          cy = int(S * 0.27)
          r = int(S * 0.13)
          cm = Image.new('L', (S, S), 0)
          cd = ImageDraw.Draw(cm)
          cd.ellipse([cx - r, cy - r, cx + r, cy + r], fill=255)
          k = int(r * 0.42)
          rr = int(r * 0.86)
          cd.ellipse([cx + k - rr, cy - rr, cx + k + rr, cy + rr], fill=0)
          img.paste(Image.new('RGBA', (S, S), GOLD), (0, 0), cm)

          d = ImageDraw.Draw(img)

          def star(x, y, big, small):
              pts = []
              for i in range(10):
                  a = -math.pi / 2 + i * math.pi / 5
                  rad = big if i % 2 == 0 else small
                  pts.append((x + rad * math.cos(a), y + rad * math.sin(a)))
              return pts

          sx = cx + int(r * 0.55)
          sy = cy - int(r * 0.05)
          d.polygon(star(sx, sy, int(r * 0.32), int(r * 0.13)), fill=GOLD)

          fp = find_font()
          print('font:', fp)

          def fit(text, maxw, start):
              size = start
              while size > 40:
                  f = ImageFont.truetype(fp, size, layout_engine=ImageFont.Layout.BASIC)
                  if f.getlength(text) <= maxw:
                      return f
                  size -= 8
              return ImageFont.truetype(fp, 40, layout_engine=ImageFont.Layout.BASIC)

          w1 = ar('\u0631\u0641\u064a\u0642')
          w2 = ar('\u0627\u0644\u0645\u0633\u0644\u0645')
          f1 = fit(w1, int(S * 0.62), 300)
          f2 = fit(w2, int(S * 0.74), 300)
          d.text((S // 2, int(S * 0.56)), w1, font=f1, fill=WHITE, anchor='mm')
          d.text((S // 2, int(S * 0.78)), w2, font=f2, fill=GOLD, anchor='mm')

          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for name, px in sizes.items():
              folder = 'android/app/src/main/res/mipmap-' + name
              os.makedirs(folder, exist_ok=True)
              img.resize((px, px), Image.Resampling.LANCZOS).save(folder + '/ic_launcher.png')
          img.save('/tmp/icon.png')

          small = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          small.paste(Image.new('RGBA', (S, S), WHITE), (0, 0), cm)
          ImageDraw.Draw(small).polygon(star(sx, sy, int(r * 0.32), int(r * 0.13)), fill=WHITE)
          crop = small.crop(small.getbbox())
          w, h = crop.size
          m = max(w, h)
          sq = Image.new('RGBA', (m, m), (0, 0, 0, 0))
          sq.paste(crop, ((m - w) // 2, (m - h) // 2))
          for name, px in {'mdpi': 24, 'hdpi': 36, 'xhdpi': 48, 'xxhdpi': 72, 'xxxhdpi': 96}.items():
              inner = int(px * 0.84)
              t = sq.resize((inner, inner), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (px, px), (0, 0, 0, 0))
              canvas.paste(t, ((px - inner) // 2, (px - inner) // 2), t)
              folder = 'android/app/src/main/res/drawable-' + name
              os.makedirs(folder, exist_ok=True)
              canvas.save(folder + '/ic_stat.png')
          PY

      - name: Custom app icon
        run: |
          /tmp/iv/bin/python - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw

          cands = []
          for pat in ('app_icon.*', 'icon.*', 'IMG_*.*', '*.png', '*.jpg', '*.jpeg', '*.PNG', '*.JPG', '*.JPEG'):
              cands += sorted(glob.glob(pat))
          cands = [c for c in cands if c.lower().endswith(('.png', '.jpg', '.jpeg'))]
          cands = [c for c in cands if not os.path.basename(c).lower().startswith('splash')]
          if not cands:
              print('no custom icon found, keeping generated icon')
              raise SystemExit(0)
          fn = cands[0]
          print('using', fn)
          src = Image.open(fn)
          S = 1024
          has_alpha = False
          if src.mode in ('RGBA', 'LA') or 'transparency' in src.info:
              a = src.convert('RGBA').getchannel('A')
              has_alpha = a.getextrema()[0] < 250
          if has_alpha:
              base = src.convert('RGBA')
              w, h = base.size
              side = min(w, h)
              x0 = (w - side) // 2
              y0 = (h - side) // 2
              out = base.crop((x0, y0, x0 + side, y0 + side)).resize((S, S), Image.Resampling.LANCZOS)
          else:
              rgb = src.convert('RGB')
              w, h = rgb.size
              l = round(w * 0.0073)
              t = round(h * 0.0073)
              r = w - round(w * 0.012)
              b = h - round(h * 0.012)
              big = rgb.crop((l, t, r, b)).resize((S, S), Image.Resampling.LANCZOS).convert('RGBA')
              SS = 4
              m = Image.new('L', (S * SS, S * SS), 0)
              ImageDraw.Draw(m).rounded_rectangle([0, 0, S * SS - 1, S * SS - 1], radius=int(S * SS * 0.205), fill=255)
              m = m.resize((S, S), Image.Resampling.LANCZOS)
              out = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              out.paste(big, (0, 0), m)
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for name, px in sizes.items():
              folder = 'android/app/src/main/res/mipmap-' + name
              os.makedirs(folder, exist_ok=True)
              out.resize((px, px), Image.Resampling.LANCZOS).save(folder + '/ic_launcher.png')
          out.resize((512, 512), Image.Resampling.LANCZOS).save('/tmp/icon.png')
          print('custom icon applied')
          PY

      - name: Native launch screen
        run: |
          python3 - <<'PY'
          import os
          R = 'android/app/src/main/res/'

          def w(path, text):
              full = R + path
              os.makedirs(os.path.dirname(full), exist_ok=True)
              open(full, 'w', encoding='utf-8').write(text)
              print('wrote', full)

          head = '<?xml version="1.0" encoding="utf-8"?>\n'
          w('values/rf_colors.xml', head +
            '<resources>\n    <color name="rf_splash_bg">#0A1B3D</color>\n</resources>\n')
          layer = (head +
                   '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n'
                   '    <item android:drawable="@color/rf_splash_bg" />\n'
                   '</layer-list>\n')
          w('drawable/launch_background.xml', layer)
          w('drawable-v21/launch_background.xml', layer)
          w('drawable/splash_empty.xml', head +
            '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n'
            '    android:width="24dp" android:height="24dp"\n'
            '    android:viewportWidth="24" android:viewportHeight="24">\n'
            '    <path android:fillColor="#00000000" android:pathData="M0,0h1v1h-1z" />\n'
            '</vector>\n')

          def style(parent):
              return (head + '<resources>\n'
                      '    <style name="LaunchTheme" parent="' + parent + '">\n'
                      '        <item name="android:windowBackground">@drawable/launch_background</item>\n'
                      '        <item name="android:windowSplashScreenBackground">@color/rf_splash_bg</item>\n'
                      '        <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_empty</item>\n'
                      '    </style>\n</resources>\n')

          w('values-v31/styles.xml', style('@android:style/Theme.Light.NoTitleBar'))
          w('values-night-v31/styles.xml', style('@android:style/Theme.Black.NoTitleBar'))
          PY

      - name: Download fonts
        run: |
          mkdir -p assets/fonts
          for n in Regular Medium Bold; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o assets/fonts/Tajawal-$n.ttf https://raw.githubusercontent.com/googlefonts/tajawal/main/fonts/ttf/Tajawal-$n.ttf
          done
          for n in Regular Bold; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o assets/fonts/Amiri-$n.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-$n.ttf || cp "$(find /usr/share/fonts -name "Amiri-$n.ttf" | head -1)" assets/fonts/Amiri-$n.ttf
          done
          ls -l assets/fonts
          test "$(ls assets/fonts | wc -l)" -eq 5

      - name: Upload icon preview
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: icon-preview
          path: /tmp/icon.png
          retention-days: 1

      - name: Configure Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          names = ['INTERNET', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION',
                   'POST_NOTIFICATIONS', 'SCHEDULE_EXACT_ALARM', 'USE_EXACT_ALARM',
                   'RECEIVE_BOOT_COMPLETED', 'VIBRATE']
          perms = ''.join('<uses-permission android:name="android.permission.%s"/>' % n for n in names)
          s = s.replace('<application', perms + '<application', 1)
          rec = ('<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />'
                 '<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">'
                 '<intent-filter>'
                 '<action android:name="android.intent.action.BOOT_COMPLETED"/>'
                 '<action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>'
                 '<action android:name="android.intent.action.QUICKBOOT_POWERON"/>'
                 '<action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>'
                 '</intent-filter></receiver>')
          s = s.replace('</application>', rec + '</application>', 1)
          s = s.replace('android:label="muslm"', 'android:label="\u0631\u0641\u064a\u0642 \u0627\u0644\u0645\u0633\u0644\u0645"')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          cat $M
          grep -q "permission.INTERNET" $M

      - run: flutter pub get

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_FILE: ${{ github.workspace }}/signing/release.jks
        run: flutter build apk --release --build-name=1.1.0 --build-number=${{ github.run_number }} --target-platform ${{ github.event.inputs.abi || 'android-arm64' }} --obfuscate --split-debug-info=build/debug-info

      - name: Show signing certificate
        run: |
          F=build/app/outputs/flutter-apk/app-release.apk
          AP=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AP verify --print-certs $F | head -4 || true
          if $AP verify --print-certs $F | grep -q "Android Debug"; then
            echo "WARNING: APK is signed with the DEBUG key"
          else
            echo "APK is signed with your release key"
          fi

      - name: APK size
        run: |
          F=build/app/outputs/flutter-apk/app-release.apk
          ls -l $F
          MB=$(( $(stat -c%s $F) / 1048576 ))
          echo "APK size: ${MB} MB"
          echo "Size by part (compressed):"
          python3 - <<'PY'
          import zipfile, collections
          z = zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk')
          agg = collections.Counter()
          for i in z.infolist():
              n = i.filename
              if n.startswith('assets/flutter_assets/assets/mushaf'):
                  k = 'quran pages'
              elif n.startswith('assets/flutter_assets/assets/data/hadith_'):
                  k = 'hadith books'
              elif n.startswith('assets/flutter_assets/assets/data'):
                  k = 'other data json'
              elif 'fonts' in n and n.startswith('assets/flutter_assets'):
                  k = 'fonts'
              elif n.startswith('res/raw'):
                  k = 'adhan audio'
              elif n.startswith('lib/'):
                  k = 'native libs'
              elif n.endswith('.dex'):
                  k = 'dex'
              else:
                  k = 'other'
              agg[k] += i.compress_size
          for k, v in agg.most_common():
              print('%-16s %6.1f MB' % (k, v / 1048576))
          PY
          if [ "$MB" -gt 50 ]; then
            echo "NOTE: APK is larger than 50 MB"
          fi

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/rafiq-almuslim.apk
          gh release create "build-${{ github.run_number }}" /tmp/rafiq-almuslim.apk --title "Build ${{ github.run_number }}" --notes "APK build ${{ github.run_number }}" --target "${{ github.sha }}"
          for t in $(gh release list --limit 50 --json tagName --jq '.[3:][].tagName'); do
            gh release delete "$t" --cleanup-tag -y || true
          done

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: muslm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
