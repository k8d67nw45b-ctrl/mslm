name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate android folder
        run: flutter create --platforms=android --project-name muslm --org com.muslm .

      - name: Configure Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          perms = ('<uses-permission android:name="android.permission.INTERNET"/>'
                   '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'
                   '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>')
          if 'permission.INTERNET' not in s:
              s = s.replace('<application', perms + '<application', 1)
          s = s.replace('android:label="muslm"', 'android:label="مسلم"')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          cat $M
          grep -q "permission.INTERNET" $M

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Check APK permissions
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions build/app/outputs/flutter-apk/app-release.apk | tee perms.txt
          grep -q "android.permission.INTERNET" perms.txt

      - uses: actions/upload-artifact@v4
        with:
          name: muslm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
