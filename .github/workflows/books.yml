name: Fetch creed books

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch texts
        run: python3 scripts/fetch_books.py

      - name: Commit texts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f -A assets/data
          git commit -m "Add creed books texts" || echo "nothing to commit"
          git push
